# SELF-CONTAINED: no source uploads or folders to rearrange.
# Paste this entire file into your existing GitHub Actions workflow and commit.
# This workflow ALWAYS builds the bundled Predictive Safe Click project,
# ignoring any old XINPUT9_1_0 DLL or other source in the repository.
