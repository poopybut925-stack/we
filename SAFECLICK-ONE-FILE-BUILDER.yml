          $expected = "41b3095030020ed82ac71540b1e040787c4dff4560af1482f88c23da3de9e78d"
          $actual = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source copy was corrupted. Paste the complete workflow." }
          $archive = Join-Path $env:RUNNER_TEMP "safe-click-source.zip"
          [IO.File]::WriteAllBytes($archive, $bytes)
          $dest = Join-Path $env:GITHUB_WORKSPACE "safeclick-project"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          if (!(Test-Path (Join-Path $dest "src/Main.cpp"))) { throw "Missing mod source" }
          Write-Host "Correct project is ready. Old repo files were ignored."

      - name: Build actual Windows Geode mod
        id: geode
        uses: geode-sdk/build-geode-mod@main
        with:
          path: safeclick-project
          sdk: 5.11.2
          target: Win64
          bindings-ref: codegen

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: SAFECLICK-GEODE-INSTALL-THIS
          path: ${{ steps.geode.outputs.build-output }}/*.geode
          if-no-files-found: error
