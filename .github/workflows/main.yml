
name: Build Windows Geode mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows mod
        id: geode
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 5.11.2
          target: Win64
          bindings-ref: codegen

      - name: Upload installable Geode file
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveSafeClick-Win64
          path: ${{ steps.geode.outputs.build-output }}
          if-no-files-found: error
